name: Sync upstream

on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/sync.py --update
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_book.py
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream
          commit-message: 'docs: sync pinned CSAPP upstream sources'
          title: 'docs: 更新 CSAPP 上游资料'
          body: |
            更新两个上游仓库的固定版本并重新生成阅读目录和来源清单。

            已完成内容清单校验、实验包校验与 Markdown 链接、图片、锚点检查。
            请检查 sources.json 和正文变更后合并；不会自动合并。连接 Git Sync 后，GitBook 会自动导入主分支更新。
          add-paths: |
            book/
            sources.json
            book-manifest.json
