name: Sync upstream

on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run sync:update
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream
          commit-message: 'docs: sync pinned CSAPP upstream sources'
          title: 'docs: 更新 CSAPP 上游资料'
          body: |
            更新两个上游仓库的固定版本并重新生成阅读目录和来源清单。

            已完成内容清单校验、站点构建、本地链接/图片/锚点检查与中文搜索索引检查。
            请检查 sources.json 和正文变更后合并；不会自动合并。
          add-paths: |
            book/
            sources.json
            book-manifest.json
